name: Plugin Adapter Tests

on:
  push:
    paths:
      - "plugin/teksi_wastewater/**"
      - "plugin/tests/adapters/**"
      - "plugin_hooks/**"
      - "pyproject.toml"
      - ".github/workflows/plugin-adapter-tests.yml"

  pull_request:
    branches:
      - main
    paths:
      - "plugin/teksi_wastewater/**"
      - "plugin/tests/adapters/**"
      - "plugin_hooks/**"
      - "pyproject.toml"
      - ".github/workflows/plugin-adapter-tests.yml"

jobs:
  unit-tests:
    name: Adapter unit tests
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.11"
          - "3.12"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run adapter tests
        env:
          PYTHONPATH: ${{ github.workspace }}/plugin:${{ github.workspace }}/plugin_hooks:${{ github.workspace }}
        run: |
          pytest -v plugin/tests/unittest/adapters

  unit-tests-db-qgis:
    name: Adapter integration tests with DB/QGIS
    runs-on: ubuntu-24.04
    env:
      DB_NAME: tww
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Setup env
        run: cp .env.example .env

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install pytest
          pip install -r plugin/teksi_wastewater/requirements.txt
          pip install -e ".[dev]"

      - name: Download Interlis libs
        run: sudo ./plugin/scripts/download-interlis-libs.sh

      - name: Start services
        run: docker compose up db qgis -d

      - name: Wait for DB
        run: |
          until docker compose exec db pg_isready -U postgres; do
            echo "Waiting for PostgreSQL..."
            sleep 2
          done

      - name: Init DB
        run: |
          docker compose exec db sh -c "createdb -U postgres ${DB_NAME}"
          docker compose run pum -p pg_tww -d datamodel install -p SRID 2056

      - name: Run pytest
        run: pytest plugin/tests/dockerised/adapters -v -c plugin/pytest.ini
        env:
          PYTHONPATH: ${{ github.workspace }}/plugin:${{ github.workspace }}/plugin_hooks:${{ github.workspace }}

      - name: Show logs
        if: failure()
        run: docker compose logs db qgis

      - name: Stop services
        if: always()
        run: docker compose down -v