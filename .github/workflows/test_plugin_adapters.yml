name: Plugin Adapter Tests

on:
  push:
    paths:
      - "plugin/teksi_wastewater/**"
      - "plugin/tests/adapters/**"
      - "plugin_hooks/**"
      - "pyproject.toml"
      - ".github/workflows/plugin-adapter-tests.yml"

  pull_request:
    branches:
      - main
    paths:
      - "plugin/teksi_wastewater/**"
      - "plugin/tests/adapters/**"
      - "plugin_hooks/**"
      - "pyproject.toml"
      - ".github/workflows/plugin-adapter-tests.yml"

jobs:
  tests:
    name: Adapter tests
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.11"
          - "3.12"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run adapter tests
        env:
          PYTHONPATH: plugin:plugin_hooks
        run: |
          pytest -v plugin/tests/adapters