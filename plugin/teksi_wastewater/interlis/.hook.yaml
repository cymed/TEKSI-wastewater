- parameters:
    SRID:
        type: integer
        default: 2056
        description: Coordinate Reference System (CRS) to use for the data. This is used for the geometry column in the database. Default is 2056 (CH1903+ / LV95).

    modification_ci:
        type: boolean
        default: false
        description: load ci modification
        app_only: true

    modification_agxx:
        type: boolean
        default: false
        description: enable AG-64/96 app modification
        app_only: true

    webgis:
        type: boolean
        default: false
        description: enable WebGIS app modification
        app_only: true

    modification_yaml:
        type: path
        description: yaml file with app modification definitions
        app_only: true

    lang_code:
        type_py: string
        type_sql: text
        default: en
        description: language code for the creation of custom views
        app_only: true
        values: [en, de, fr, it]
    files:
        file: /datamodel/app/modification_repos/dummy/000_demo.sql
        file: /datamodel/app/modification_repos/dummy/000_demo.py
        file: /datamodel/app/modification_repos/dummy/001_demo.sql

